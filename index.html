<title>Cahier TCF</title>
<style>
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --bar:rgba(249,249,249,.82); --fg:#000; --muted:#6C6C70; --sep:rgba(60,60,67,.2); --fill:rgba(120,120,128,.12); --segon:#FFFFFF;
  --acc:#FA233B; --acc-soft:rgba(250,35,59,.12);
  --ok:#248A3D; --ok-soft:rgba(52,199,89,.16); --bad:#D70015; --bad-soft:rgba(255,59,48,.13); --warn:#B25000; --warn-soft:rgba(255,159,10,.18);
  --ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue','Segoe UI',Roboto,system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --orange:var(--acc); --orange-soft:var(--acc-soft); --edge:var(--sep); --glass:var(--fill); --glass-hi:var(--fill); --ink:var(--acc); --ink-fg:#fff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000; --cell:#1C1C1E; --bar:rgba(30,30,30,.8); --fg:#fff; --muted:#98989F; --sep:rgba(84,84,88,.65); --fill:rgba(120,120,128,.24); --segon:#636366;
  --acc:#FF375F; --acc-soft:rgba(255,55,95,.18);
  --ok:#30D158; --ok-soft:rgba(48,209,88,.17); --bad:#FF6961; --bad-soft:rgba(255,69,58,.18); --warn:#FF9F0A; --warn-soft:rgba(255,159,10,.18); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000; --cell:#1C1C1E; --bar:rgba(30,30,30,.8); --fg:#fff; --muted:#98989F; --sep:rgba(84,84,88,.65); --fill:rgba(120,120,128,.24); --segon:#636366;
  --acc:#FF375F; --acc-soft:rgba(255,55,95,.18);
  --ok:#30D158; --ok-soft:rgba(48,209,88,.17); --bad:#FF6961; --bad-soft:rgba(255,69,58,.18); --warn:#FF9F0A; --warn-soft:rgba(255,159,10,.18); color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(88px + var(--safe-b));min-height:100vh;overflow-x:hidden}
.wrap{max-width:640px;margin-inline:auto;padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-appearance:none;appearance:none}
h1,h2,h3,h4,p{margin:0}
h2{font-size:1.45rem;font-weight:700;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
h2 .dim{color:var(--muted)}
h3{font-size:1.05rem;font-weight:600}
h4{font-size:.9rem;font-weight:600;margin:0 0 4px}
.muted{color:var(--muted)} .small{font-size:.85rem} .num{font-variant-numeric:tabular-nums}
.fr{font-size:1.1rem;line-height:1.7}

/* nav bar */
.nav{position:sticky;top:0;z-index:10;height:calc(44px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 4px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:.5px solid transparent;transition:background .2s,border-color .2s}
.nav.solid{background:var(--bar);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-bottom-color:var(--sep)}
.nav .t{font-weight:600;font-size:1rem;opacity:0;transition:opacity .2s;white-space:nowrap}
.nav.solid .t{opacity:1}
.navback{justify-self:start;background:none;border:0;color:var(--acc);font-size:1.05rem;padding:8px 10px;min-height:44px;cursor:pointer;display:flex;align-items:center;gap:2px}
.navback[hidden]{display:none}
.navback svg{width:12px;height:20px}
.lt{padding:2px 0 14px}
.lt h1{font-size:2.15rem;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.lt p{color:var(--muted);margin-top:4px;font-size:.95rem}
main{display:flex;flex-direction:column;gap:22px;padding-bottom:24px;min-height:60vh}
main>section,main>div{min-width:0}
.sh{font-size:1.35rem;font-weight:700;letter-spacing:-.015em}
.shrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.lnk{background:none;border:0;color:var(--acc);font-weight:500;cursor:pointer;padding:6px 4px}
.foot{font-size:.8rem;color:var(--muted);padding:0 4px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-top:.5px solid var(--sep);padding-bottom:var(--safe-b)}
.tabbar-in{display:flex;max-width:640px;margin-inline:auto}
.tabbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;color:var(--muted);font-size:.64rem;font-weight:500;cursor:pointer;min-width:0}
.tabbar button[aria-selected="true"]{color:var(--acc)}
.tabbar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"] svg{stroke-width:2.2}

/* surfaces */
.card{background:var(--cell);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.flat{background:none;padding:0 4px;gap:6px;font-size:.82rem}
button.card{text-align:left;cursor:pointer;border:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}

/* top picks */
.pickrow{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:0 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pickrow::-webkit-scrollbar{display:none}
.pick{flex:0 0 min(264px,72vw);scroll-snap-align:start;scroll-margin-left:16px;text-align:left;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:7px;color:inherit}
.pick .lab{font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pick .sub{font-size:.88rem;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.art{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;color:#fff;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 8px 20px -10px rgba(0,0,0,.35)}
.art svg{position:absolute;right:-18px;top:-14px;width:150px;height:150px;fill:none;stroke:rgba(255,255,255,.28);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.art b{position:relative;font-size:1.55rem;font-weight:700;letter-spacing:-.02em;line-height:1.12;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.g1{background:linear-gradient(155deg,#FF6A88,#FA233B 55%,#A8102B)}
.g2{background:linear-gradient(155deg,#FFB44D,#FF6B3D 58%,#C9371C)}
.g3{background:linear-gradient(155deg,#7C9BFF,#5B5BE6 55%,#352A9E)}
.g4{background:linear-gradient(155deg,#3CD0B0,#1B918C 58%,#0F6272)}

/* lists */
.group{background:var(--cell);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;background:none;border:0;text-align:left;cursor:pointer;position:relative;min-height:62px;color:inherit}
.item+.item::before{content:"";position:absolute;top:0;left:70px;right:0;border-top:.5px solid var(--sep)}
.group.ck .item+.item::before{left:50px}
.item:active{background:var(--fill)}
.item .mn{flex:1;min-width:0}
.item .tt{font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .sb{font-size:.82rem;color:var(--muted);margin-top:2px}
.item .chev{color:var(--muted);opacity:.55;width:8px;height:14px;flex:0 0 8px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.thumb{flex:0 0 46px;height:46px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.82rem;letter-spacing:.02em}
.ckc{flex:0 0 24px;height:24px;border-radius:50%;border:1.6px solid var(--muted);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:#fff;opacity:.9}
.done>.ckc,.item[aria-pressed="true"] .ckc{background:var(--acc);border-color:var(--acc)}
.done>.ckc::after,.item[aria-pressed="true"] .ckc::after{content:"✓"}
.done .tt{color:var(--muted)}
.item .cnt{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* controls */
.btn{background:var(--fill);color:var(--acc);border:0;border-radius:999px;padding:8px 18px;font-weight:600;font-size:.95rem;cursor:pointer;min-height:42px}
.btn:active{opacity:.6}
.btn.primary{background:var(--acc);color:#fff}
.btn.sm{padding:4px 14px;min-height:34px;font-size:.85rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg,.lv{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg button,.lv button{flex:1 0 auto;background:none;border:0;border-radius:7px;padding:6px 10px;font-size:.8rem;font-weight:500;color:var(--fg);cursor:pointer;white-space:nowrap;min-height:30px}
.seg button[aria-pressed="true"],.lv button[aria-selected="true"]{background:var(--segon);box-shadow:0 1px 3px rgba(0,0,0,.2);font-weight:600}
.lv button.done:not([aria-selected="true"]){color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--fill);border-radius:999px;padding:6px 14px;font-size:.88rem;cursor:pointer;font-weight:500;min-height:34px}
.chip[aria-pressed="true"]{background:var(--acc);color:#fff}
.chip[aria-pressed="true"] .muted{color:inherit;opacity:.75}
.tag{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--fill);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.acc{background:var(--acc-soft);color:var(--acc)}
textarea,.in{width:100%;background:var(--fill);border:0;border-radius:10px;padding:10px 14px;font-size:16px}
textarea{min-height:150px;resize:vertical;line-height:1.6;padding:12px 14px}
textarea:focus,.in:focus{outline:2px solid var(--acc);outline-offset:0}
details>summary{cursor:pointer;font-weight:500;color:var(--acc)}
.bar{height:5px;border-radius:99px;background:var(--fill);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px}
.pips{display:flex;gap:4px;margin-top:5px}
.pips i{width:16px;height:4px;border-radius:2px;background:var(--fill)}
.pips i.on{background:var(--acc)}
.stat{gap:4px}
.stat b{font-size:2.2rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}

/* writing */
.model{background:var(--fill);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.model p{white-space:pre-line}
input.blank{font:inherit;font-size:16px;border:0;border-bottom:2px solid var(--acc);background:var(--acc-soft);color:var(--fg);padding:0 4px;border-radius:6px 6px 0 0;text-align:center;min-width:2.5ch;max-width:100%}
input.blank.ok{border-color:var(--ok);background:var(--ok-soft)}
input.blank.bad{border-color:var(--bad);background:var(--bad-soft)}
.cloze{line-height:2.5}
.wc{font-size:.88rem;font-variant-numeric:tabular-nums;color:var(--muted)} .wc.ok{color:var(--ok)} .wc.warn{color:var(--warn)}
.timer{font-size:2rem;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1}
.timer.low{color:var(--bad)}
.sent{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.sent .op{font-weight:600;white-space:nowrap}
.cmp{background:var(--ok-soft);border-radius:10px;padding:8px 12px;font-size:.98rem;grid-column:1/-1}
.err{display:grid;gap:2px;border-left:3px solid var(--acc);padding:2px 0 2px 12px}
.err .o{color:var(--bad);text-decoration:line-through} .err .f{color:var(--ok);font-weight:600}
ul.tight{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px}

/* oral: lyrics-style */
.cue{font-size:1.65rem;font-weight:700;line-height:1.28;letter-spacing:-.02em;text-wrap:balance}
.answer{font-size:1.1rem;line-height:1.65;background:var(--ok-soft);border-radius:12px;padding:12px 16px}

/* drill */
.drow{display:grid;grid-template-columns:7rem 1fr 1.4rem;gap:10px;align-items:center}
.drow label{text-align:right;color:var(--muted)}
.drow .in{font-size:16px}
.drow .in.ok{outline:2px solid var(--ok);background:var(--ok-soft)}
.drow .in.bad{outline:2px solid var(--bad);background:var(--bad-soft)}
.drow .mk{font-weight:700}
.drow .corr{grid-column:2/-1;color:var(--ok);font-weight:600;font-size:.95rem}
.vgrid{display:flex;flex-wrap:wrap;gap:8px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 6px;border-bottom:.5px solid var(--sep);vertical-align:top;font-size:.88rem}
th{color:var(--muted);font-weight:500;font-size:.78rem}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(76px + var(--safe-b));transform:translateX(-50%);background:rgba(40,40,42,.94);color:#fff;padding:10px 20px;border-radius:999px;font-weight:500;font-size:.9rem;z-index:20;max-width:90vw;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.toast[hidden]{display:none}
@media (max-width:400px){.drow{grid-template-columns:4.8rem 1fr 1.2rem}.sent{grid-template-columns:1fr}.lt h1{font-size:1.95rem}}
@media (min-width:700px){.wrap{max-width:700px}}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s}}
</style>

<script>
const DATA = {"writing": [{"id": "w1-0", "task": 1, "title": "Message à des amis : événement sportif", "prompt": "Vous participez à un événement sportif dans votre ville. Écrivez un message à vos amis pour les informer (date, lieu, activités).", "points": ["Tell your friends you're taking part in a sports event", "Date and place (Saturday, central park, from 10 a.m.)", "What's on: running, football and basketball, yoga, food and drink stalls", "Invite them to come along"], "model": "Bonjour les amis,\n\nJe voulais vous informer que je participe à un événement sportif dans notre ville le samedi 12 mars prochain. L'événement se déroulera au parc central à partir de 10 heures du matin.\n\nIl y aura de nombreuses activités intéressantes telles que des courses à pied, des matchs amicaux de football et de basketball, ainsi que des séances de yoga et de fitness en plein air. En plus des activités sportives, il y aura aussi des stands de rafraîchissements et de restauration.\n\nJ'espère que vous pourrez venir et partager cette expérience sportive avec moi.\n\nA bientôt,\nNeo"}, {"id": "w1-2", "task": 1, "title": "Proposer un jogging", "prompt": "Vous proposez à une amie de faire du jogging avec vous le matin. Écrivez-lui un message.", "points": ["Greet her and suggest jogging together every morning", "Reason: you live close, run around the lake", "The setting: great view, fresh air", "Ask what she thinks, wait for her reply"], "model": "Salut Estelle,\n\nComment vas-tu ?\n\nJe me demandais si tu serais intéressée par une séance de jogging avec moi le matin. Comme nous habitons toutes les deux à Burnaby, ce serait une excellente idée de faire une demi-heure de jogging autour du lac Deer Lake chaque matin avant d’aller travailler.\n\nCet environnement offre une vue magnifique et de l’air frais, parfait pour bien commencer la journée. Ce serait non seulement une excellente façon de rester en forme, mais aussi une belle opportunité de passer un moment agréable ensemble. Qu'en penses-tu ? J’attends ta réponse.\n\nÀ très bientôt!\nNeo"}, {"id": "w1-7", "task": 1, "title": "Festival de cinéma", "prompt": "Vous invitez un(e) ami(e) à un festival de cinéma organisé dans votre ville. Donnez-lui toutes les informations (dates, programme, prix, horaires, lieu).", "points": ["Invite your friend to the film festival, give the dates (May 1 to 7)", "Programme: many genres and countries, full schedule on the official site", "Price: 10 euros per screening", "Times and place: from 10 a.m. daily, at the city-centre cinema"], "model": "Salut Éric,\n\nJ'ai le plaisir de t'inviter au festival de cinéma qui aura lieu dans notre ville du 1er au 7 mai.\n\nCet événement proposera une sélection variée de films provenant de différents genres et pays. Le programme détaillé est disponible sur le site officiel du festival. Le prix d'entrée pour une séance est de 10 euros.\n\nLes projections débuteront chaque jour à partir de 10h du matin et se poursuivront jusqu'en soirée. Elles auront lieu au cinéma municipal, en plein cœur du centre-ville. J'espère que tu pourras te joindre à nous pour cette semaine immersive de cinéma ! N'hésite pas à me contacter si tu as besoin de plus d'infos.\n\nCordialement,\nNeo"}, {"id": "w1-13", "task": 1, "title": "Anniversaire surprise", "prompt": "Vous invitez vos amis à une fête d'anniversaire surprise pour un ami commun. Écrivez-leur un message.", "points": ["Invite everyone to a surprise birthday party for a friend", "When and where: March 20, 7 p.m., in the garden", "Plan: games and activities, a shared gift", "Ask them to contact you for details, say you hope they can come"], "model": "Chers amis,\n\nJ'espère que vous allez bien ! Je vous écris aujourd'hui pour vous inviter à une fête d'anniversaire surprise pour notre ami commun, Jean.\n\nLa fête aura lieu le samedi 20 mars à partir de 19 heures dans notre jardin. Nous organiserons des jeux et des activités amusants tout au long de la soirée et nous avons prévu un cadeau commun pour Jean.\n\nNous espérons que vous pourrez tous venir célébrer l'anniversaire de Jean avec nous. Si vous avez besoin de plus de détails, n'hésitez pas à nous contacter. Merci d'avance et à très bientôt !\n\nCordialement,\nNeo"}, {"id": "w1-20", "task": 1, "title": "Soirée de fin d'année", "prompt": "Vous invitez vos amis à une soirée de fin d'année chez vous. Écrivez-leur un message.", "points": ["Invite everyone to an end-of-year party at your place, give the date", "Purpose: relax, laugh, enjoy good moments", "You provide food and drinks, guests may bring something to share", "Ask them to confirm their attendance soon"], "model": "Salut à tous,\n\nJ'espère que vous allez bien ! Comme la fin de l'année approche, je me suis dit qu'il serait génial de tous nous retrouver pour célébrer ensemble. Je vous invite donc à une soirée de fin d'année chez moi le 5 Mai, à partir de 10h.\n\nCe sera l'occasion de décompresser, de rire et de profiter de bons moments avant de plonger dans la nouvelle année. Je prévoirai de la nourriture et des boissons, mais n'hésitez pas à apporter aussi quelque chose à partager !\n\nMerci de me confirmer votre présence dès que possible, pour que je puisse organiser au mieux.\n\nHâte de vous voir tous pour une super soirée !\n\nBises,\nNeo"}, {"id": "w1-28", "task": 1, "title": "Se déplacer en ville", "prompt": "Un ami arrive dans votre ville. Écrivez-lui pour lui expliquer comment se déplacer (moyens de transport, prix).", "points": ["Welcome your friend to the city", "Transport: bus and tram are the most practical and cheapest", "Prices: single ticket about 1.50 euros, monthly pass about 40 euros, unlimited", "Offer more advice if needed"], "model": "Salut Mehdi,\n\nBienvenue dans notre ville! Je suis ravi que tu sois là et je suis sûr que tu vas vite te sentir chez toi. Concernant les transports, tu as pas mal d'options pour te déplacer. Les bus et le tramway sont les moyens les plus pratiques et économiques pour parcourir la ville. Un ticket simple coûte environ 1,50 €, mais si tu comptes les utiliser souvent, je te recommande de prendre un abonnement mensuel qui est aux alentours de 40 €. Cela te donne un accès illimité à tout le réseau de transport en commun.\n\nSi tu as besoin de conseils supplémentaires, n'hésite pas à me le faire savoir. Je serais ravi de t'aider à mieux connaître les options de transport ici.\n\nÀ très bientôt,\nNeo"}, {"id": "w1-31", "task": 1, "title": "Inviter dans ma nouvelle ville", "prompt": "Vous venez de déménager dans une nouvelle ville. Écrivez à un ami pour l'inviter à venir passer quelques jours chez vous.", "points": ["Greet your friend, say you've moved to Vancouver and settled in well", "The city has plenty to see and do: parks, museums, restaurants", "You'd love to explore together and catch up", "Ask when he's free"], "model": "Salut Eric,\n\nJ'espère que tout va bien pour toi ! Comme tu le sais, j’ai récemment déménagé à Vancouver et je dois dire que c'est un endroit fantastique. Je me suis bien installé(e) et j'aimerais vraiment que tu viennes passer quelques jours de vacances avec moi. Il y a tant à voir et à faire ici, des parcs paisibles aux musées intéressants, sans oublier les bons petits restaurants du coin.\n\nCe serait génial de pouvoir explorer la ville ensemble et de rattraper le temps perdu. Tu es libre quand ? Dis-moi tes disponibilités et préparons-nous pour de superbes moments.\n\nÀ très bientôt j'espère !\n\nBises,\nNeo"}, {"id": "w1-36", "task": 1, "title": "Un hôtel pour les vacances", "prompt": "Vous avez trouvé un hôtel pour vos prochaines vacances. Écrivez à vos amis pour le leur présenter (situation, chambres, prix).", "points": ["Tell everyone you've found a great hotel", "Location: a few minutes from the beach, quiet area", "Rooms: spacious, bright, well equipped", "Price is reasonable; recommend booking soon"], "model": "Chers amis,\n\nJe suis très heureux de partager avec vous que j'ai trouvé un super hôtel pour nos prochaines vacances .\n\nCet hôtel est situé à quelques minutes de la plage, dans un quartier calme et agréable. Les chambres sont spacieuses, lumineuses et très bien équipées avec tout ce dont nous avons besoin pour notre confort. Le prix est également très raisonnable par rapport à la qualité de l'hôtel et de ses équipements.\n\nJe vous recommande vivement de réserver cet hôtel dès que possible avant qu'il ne soit complet. Je suis sûr que nous allons passer des moments inoubliables ensemble.\n\nBien à vous,\nNeo"}, {"id": "w1-41", "task": 1, "title": "Garder ma maison", "prompt": "Un ami garde votre maison et votre jardin pendant vos vacances. Écrivez-lui ce qu'il doit savoir.", "points": ["Thank him for looking after the house and garden", "Garden: water the plants every two days, especially the pots on the terrace", "Mail: collect it daily, bring parcels inside", "Tell him to make himself at home and to contact you with questions"], "model": "Salut Cédric,\n\nMerci encore de t’occuper de la maison et du jardin pendant que nous sommes en vacances, c’est vraiment super sympa de ta part ! Voici quelques petites choses à savoir pour que tout se passe bien: Concernant le jardin, il serait super si tu pouvais arroser les plantes tous les deux jours, surtout les pots sur la terrasse qui ont tendance à se dessécher rapidement. Pour le courrier, il suffit de le relever quotidiennement et de rentrer les colis à l'intérieur pour qu'ils ne restent pas dehors.\n\nN’hésite pas à faire comme chez toi et à me contacter si tu as des questions.\n\nÀ bientôt!\nNeo"}, {"id": "w1-45", "task": 1, "title": "Mon entretien d'embauche", "prompt": "Racontez à un(e) ami(e) comment s'est passé votre entretien d'embauche.", "points": ["Tell your friend the interview went well overall", "What happened: company presentation, met your future manager, discussed your experience and skills", "At the end you asked questions about the company and the job", "Now waiting for an answer; thank your friend for the support"], "model": "Cher(e) ami(e),\n\nJe voulais te raconter comment s'est déroulé mon entretien d'embauche aujourd'hui. Dans l'ensemble, je pense que cela s'est bien passé !\n\nL'entretien a commencé par une présentation de l'entreprise et de son histoire. Ensuite, j'ai rencontré mon futur responsable et nous avons discuté en détail de mes expériences passées et de mes compétences. En fin d'entretien, j'ai également eu l'opportunité de poser des questions sur l'entreprise et le poste. Mon responsable a répondu à toutes mes questions avec patience et clarté.\n\nJe suis maintenant dans l'attente d'une réponse de leur part. Je te tiendrai au courant de la suite. Merci encore pour ton soutien et tes encouragements.\n\nÀ bientôt,\nNeo"}, {"id": "w1-47", "task": 1, "title": "Un nouveau travail", "prompt": "Annoncez à un ami que vous avez trouvé un nouveau travail. Décrivez le bureau et vos collègues.", "points": ["Announce you got a new job (data analyst)", "The office: in a lively new district full of cafés and green spaces", "Colleagues: a dynamic, diverse, warm team", "Looking forward to starting; arrange to meet and tell him everything"], "model": "Salut Cédric,\n\nJe suis tellement enthousiaste de t'annoncer que j'ai décroché un nouveau job ! Après des mois de recherches, j'ai finalement été embauchée en tant que analyste de données chez XXX.\n\nLe bureau est absolument incroyable; il est situé dans un nouveau quartier dynamique de la ville, plein de cafés et d'espaces verts. Mes nouveaux collègues sont une équipe dynamique et diverse, venant de divers horizons professionnels. L'ambiance est très chaleureuse et tout le monde semble vraiment impliqué dans son travail.\n\nJe suis vraiment impatiente de commencer ce nouveau chapitre de ma vie professionnelle et de voir où cela va me mener. On doit absolument se voir pour que je te raconte tout en détail!\n\nÀ très bientôt,\nNeo"}, {"id": "w1-52", "task": 1, "title": "Vendre mon vélo", "prompt": "Vous avez un vélo à vendre. Écrivez un courriel pour le décrire, proposer un prix et donner un rendez-vous pour l'essayer.", "points": ["Answer the ad: say you have the right bike", "Describe it: city bike in very good condition, gears, disc brakes, rear rack, aluminium frame", "Price: 150 euros, slightly negotiable", "Suggest a time to try it out and ask them to contact you"], "model": "Bonjour Mathieu,\n\nJ'ai vu votre annonce concernant la recherche d'un vélo et je pense avoir ce qu'il vous faut. Je propose un vélo de ville en très bon état, parfait pour des trajets quotidiens ou des balades en weekend. Il est équipé de vitesses Shimano, de freins à disque, et d'un porte-bagages arrière. Le cadre est en aluminium, ce qui le rend léger et maniable.\n\nJe vous propose ce vélo pour 150 euros, légèrement négociable. Si vous êtes intéressé, nous pourrions convenir d'un rendez-vous pour que vous puissiez l'essayer et voir s'il répond à vos attentes.\n\nMerci de me contacter à votre convenance pour organiser cela.\n\nCordialement,\nNeo"}, {"id": "w2-0", "task": 2, "title": "Une soirée écologique", "prompt": "Écrivez un article pour le journal de votre université : racontez une soirée écologique à laquelle vous avez assisté.", "points": ["Last night you attended an ecology evening at your university; it was inspiring", "It began with a talk by ecology experts on today's challenges and everyday solutions", "Then practical workshops: eco-friendly cleaning products, creative recycling, cutting your carbon footprint", "Conclusion: it opened your eyes; you hope more events like this are organised"], "model": "Chers Lecteurs :\n\nHier soir, j'ai eu la chance d'assister à une soirée écologique organisée dans mon université, et je dois dire que cela était une expérience incroyablement enrichissante et inspirante!\n\nLa soirée a débuté par une conférence passionnante animée par des experts en écologie, qui nous ont parlé des défis environnementaux actuels et des solutions que chacun peut adopter au quotidien. Ensuite, plusieurs ateliers pratiques étaient proposés, comme la fabrication de produits ménagers écologiques, le recyclage créatif ou encore des astuces pour réduire notre empreinte carbone.\n\nEn conclusion, cette soirée m'a ouvert les yeux sur de nombreux aspects de la transition écologique et m'a donné des idées concrètes pour adopter un mode de vie plus respectueux de la planète. J'espère que mon université organisera d'autres événements comme celui-ci, car ils sont essentiels pour sensibiliser et encourager les actions positives.\n\nMerci de m'avoir lu,\nNeo"}, {"id": "w2-1", "task": 2, "title": "Un cours de cuisine", "prompt": "Racontez dans un article votre expérience d'un cours de cuisine auquel vous avez participé.", "points": ["Last week you took a cooking class: enriching and delicious", "Warm, friendly atmosphere; a well-equipped kitchen, each person at their own station", "The chef first explained the menu: starter, main course, dessert", "Result: more confidence, new techniques; you recommend it"], "model": "Chers lecteurs,\n\nLa semaine dernière, j'ai eu l'opportunité de participer à un cours de cuisine et je dois dire que ce fut une expérience aussi enrichissante que délicieuse!\n\nDès mon arrivée, l'ambiance était chaleureuse et conviviale. Le cours s'est déroulé dans une grande cuisine équipée, où chaque participant disposait de son propre plan de travail. Notre chef, un véritable passionné, nous a d'abord expliqué le menu du jour : une entrée légère, un plat principal raffiné et un dessert gourmand. Chaque étape était bien expliquée et j'ai été surpris(e) de voir à quel point certains gestes de professionnels peuvent faire toute la différence !\n\nCe cours m'a permis de gagner en confiance en cuisine et d'apprendre de nouvelles techniques que je vais sans aucun doute réutiliser chez moi. Je recommande vivement cette expérience à tous ceux qui veulent progresser en cuisine. Merci de m'avoir lu,\n\nNeo"}, {"id": "w2-2", "task": 2, "title": "Vivre à la campagne", "prompt": "Vous avez quitté la ville pour la campagne. Racontez votre expérience dans un article.", "points": ["Say you recently left the city for the countryside", "The setting: peaceful, no traffic or pollution, clean air", "Property is cheaper: a big house with a garden, you grow your own vegetables", "Conclusion: great quality of life, you recommend it"], "model": "Chers lecteurs,\n\nJ’espère que vous allez bien.\n\nComme je l’ai mentionné dans mon dernier article de blog, j’ai récemment quitté la ville pour m’installer à la campagne, et j’aimerais partager avec vous les expériences incroyables que j’ai vécues depuis ce changement.\n\nTout d’abord, la campagne offre un cadre de vie paisible, loin des embouteillages et de la pollution urbaine. L’air pur et le calme ambiant favorisent un mode de vie plus sain et serein. De plus, le coût de l’immobilier y est bien plus abordable, ce qui m’a permis d’acquérir une maison spacieuse avec un grand jardin. J’y cultive désormais mes propres fruits et légumes, une activité qui contribue non seulement à mon bien-être, mais aussi à ma santé.\n\nVivre à la campagne est une expérience enrichissante que je recommande vivement à tous. Ce mode de vie offre une qualité de vie incomparable et mérite vraiment d’être découvert.\n\nMerci de m'avoir lu,\nNeo"}, {"id": "w2-8", "task": 2, "title": "La fête de mon quartier", "prompt": "Racontez la fête annuelle de votre quartier à laquelle vous avez assisté.", "points": ["Yesterday you attended your neighbourhood's annual party", "Atmosphere: the street became a party space, neighbours brought a variety of dishes", "A local band played live, everyone danced and laughed, neighbours shared stories", "What you took from it: you know your neighbours better and feel more connected"], "model": "Bonjour à tous,\n\nHier, j'ai assisté à la fête annuelle de notre quartier, un événement qui a réellement enrichi mon appréciation pour ma communauté locale. L'ambiance était incroyablement chaleureuse, la rue transformée en espace festif, avec des tables débordant de plats variés apportés par les résidents, reflétant la diversité culinaire du quartier.\n\nUn groupe local a animé la soirée avec de la musique live, créant une atmosphère détendue qui a rassemblé tout le monde en danses et rires. Ce que j'ai le plus apprécié, ce sont les échanges avec mes voisins. Chacun partageait des histoires et des anecdotes, renforçant notre sentiment de communauté.\n\nCette expérience m'a non seulement permis de mieux connaître les gens qui vivent autour de moi, mais aussi de me sentir plus connecté à mon environnement immédiat. Vivement la prochaine fête pour renforcer encore ces liens précieux !\n\nCordialement,\nNeo"}, {"id": "w2-9", "task": 2, "title": "La Fête des Lanternes", "prompt": "Présentez une fête traditionnelle à laquelle vous avez participé.", "points": ["Recently you took part in the Lantern Festival, the end of the Chinese New Year celebrations", "When: the fifteenth day of the first lunar month", "What makes it special: lit lanterns floating in the night sky, a symbol of hope and renewal", "Food: tangyuan, symbolising reunion; you felt part of a community and a living culture"], "model": "Chers lecteurs,\n\nRécemment, j'ai eu l'immense joie d'assister à la Fête des Lanternes en Chine, une expérience inoubliable qui marque la fin des célébrations du Nouvel An chinois. L'événement est célébré le quinzième jour du premier mois lunaire et apporte une clôture lumineuse et joyeuse aux festivités prolongées.\n\nCe qui rend cette fête si spéciale, c’est le spectacle des lanternes illuminées flottant dans le ciel nocturne. Chaque lanterne, avec ses lumières vacillantes, semble emporter les souhaits et les rêves vers les étoiles. C'est une vue vraiment magique, symbolisant l'espoir et le renouveau.\n\nJ'ai également adoré les tangyuans, ces délicieuses boulettes de riz gluant servies en bouillon sucré, symbolisant l'union et la prospérité. Participer à cette fête m'a permis de ressentir un profond sentiment de communauté et de continuité culturelle. La Fête des Lanternes n'est pas seulement belle à voir; elle enrichit l'esprit, ce qui explique pourquoi je l'ai tant aimée.\n\nCordialement,\nNeo"}, {"id": "w2-11", "task": 2, "title": "Un concert inoubliable", "prompt": "Racontez un concert auquel vous avez assisté.", "points": ["A few days ago you saw your favourite artist in concert, one of the best experiences of your life", "At the start he played his biggest hits and the crowd sang and danced", "The lights and special effects were stunning", "Conclusion: strongly recommended, unforgettable"], "model": "Chers lecteurs,\n\nIl y a quelques jours, j'ai eu la chance d'assister au concert de Zhou Shen, mon artiste préféré, et je dois dire que cela a été l'une des meilleures expériences de ma vie. La musique, les lumières, l'ambiance - tout était parfait. J'ai été emporté par l'énergie incroyable de la foule et de l'artiste.\n\nDès le début du concert, j'ai été impressionné par le talent et la passion de l'artiste. Il a commencé avec quelques-uns de ses plus grands succès, et la foule a immédiatement commencé à chanter et à danser avec lui. Les lumières et les effets spéciaux étaient tout simplement époustouflants, créant une ambiance vraiment magique.\n\nEn somme, je recommande vivement le concert de cet artiste. C'est un événement que je n'oublierai jamais, et je suis sûr que ceux qui y assisteront seront tout aussi enchantés que moi.\n\nCordialement,\nNeo"}, {"id": "w2-13", "task": 2, "title": "Ma première semaine de travail", "prompt": "Racontez à vos amis votre première semaine dans votre nouveau travail.", "points": ["Tell your friends about your first week in the new job", "You met colleagues and the boss, and had a tour of the company", "Then you got used to your responsibilities: some projects were hard at first, team meetings", "Overall excited; you'll keep them posted"], "model": "Chers amis,\n\nJ'espère que vous allez bien. Je voulais vous raconter comment s'est passée ma première semaine dans mon nouveau travail.\n\nTout d'abord, j'ai rencontré mes nouveaux collègues et mon patron. Ils sont tous très sympathiques et accueillants. J'ai également eu une visite guidée de l'entreprise, ce qui m'a aidé à comprendre le fonctionnement de la société et à savoir où se trouvent les différents services.\n\nEnsuite, j'ai commencé à m'habituer à mes nouvelles responsabilités. J'ai travaillé sur quelques projets qui étaient un peu difficiles au début, mais j'ai rapidement compris comment les aborder. J'ai également assisté à plusieurs réunions avec l'équipe pour discuter de notre stratégie et de nos objectifs à court et à long terme. Dans l'ensemble, je suis très enthousiaste pour ce nouveau poste et j'ai hâte de voir ce que l'avenir me réserve.\n\nJe vous tiendrai informé de mes progrès dans mon nouveau travail!\n\nCordialement,"}, {"id": "w2-15", "task": 2, "title": "Travailler pendant les congés", "prompt": "Racontez votre expérience de travail pendant vos congés.", "points": ["This year you worked during your holidays to gain skills and earn extra money", "A month in an online-sales company, marketing department", "You learned digital tools to promote products and built communication, organisation and problem-solving skills", "Recommend everyone try it"], "model": "Chers amis,\n\nCette année, j'ai décidé de travailler pendant mes congés pour acquérir de nouvelles compétences et pour gagner un peu d'argent supplémentaire. J'ai travaillé pendant un mois dans une entreprise de vente en ligne, et cela a été une expérience incroyable que je suis ravie de partager avec vous.\n\nJ'ai travaillé dans le département marketing de l'entreprise, où j'ai pu apprendre à utiliser des outils numériques pour promouvoir des produits en ligne. Travailler dans un environnement professionnel a été très différent de mon travail habituel, mais cela m'a permis de développer mes compétences en communication, en organisation et en résolution de problèmes.\n\nEn résumé, je recommande à tout le monde d'essayer de travailler pendant leurs vacances, car cela peut être une expérience très enrichissante.\n\nMerci de m'avoir lu et à bientôt !"}, {"id": "w2-22", "task": 2, "title": "Ma première semaine à l'université", "prompt": "Écrivez à une amie pour lui raconter votre première semaine à l'université.", "points": ["Tell your friend about your first week at university in Montréal", "You're happy and feel you're in the right place; the campus is huge", "Interesting classes, great professors, more demanding than high school", "Only downside: getting lost on campus at first"], "model": "Chère Estelle,\n\nJe voulais te donner des nouvelles de ma première semaine à l'université à Montréal ! Tout d'abord, je suis tellement heureux(se) d'être ici et j'ai vraiment l'impression que je suis au bon endroit. L'université est immense et il y a tellement de choses à découvrir.\n\nJ'ai assisté à plusieurs cours intéressants et j'ai déjà rencontré des professeurs géniaux. J'ai été impressionné(e) par l'organisation des cours et la qualité de l'enseignement. Les cours sont plus exigeants que ceux du lycée, mais je suis motivé(e) à travailler dur pour réussir.\n\nLe seul point négatif, c'est que j'ai eu du mal à me retrouver dans le campus au début, c'est tellement grand !\n\nDans l'ensemble, je suis très heureux(se) de mon choix. J'ai hâte de te donner plus de détails sur mes aventures universitaires et j'espère te revoir bientôt ! Amicalement,"}, {"id": "w2-25", "task": 2, "title": "Quitter les réseaux sociaux", "prompt": "Expliquez à vos amis pourquoi vous avez décidé de ne plus utiliser les réseaux sociaux.", "points": ["After long thought you decided to stop using social media", "Reason 1: refocus on what matters, away from noise and distraction", "Reason 2: want more authentic face-to-face interaction", "Reason 3: protect your privacy and mental health"], "model": "Chers amis,\n\nAprès une longue réflexion, j'ai décidé de ne plus utiliser les réseaux sociaux comme Twitter, Instagram, Facebook, et autres. Cette décision n'a pas été facile à prendre, mais elle est motivée par plusieurs raisons importantes pour moi.\n\nTout d'abord, je ressens le besoin de me recentrer sur l'essentiel et de prendre du temps pour moi-même, loin du bruit constant et des distractions que les réseaux sociaux peuvent provoquer. Ensuite, je veux me concentrer sur des interactions plus authentiques et significatives, en privilégiant les relations en face à face ou par des moyens de communication plus personnels. Enfin, je crois qu'il est important de protéger ma vie privée et de réduire l'impact des technologies sur ma santé mentale. J'espère que vous comprenez cette décision, et j'ai hâte de continuer à échanger avec vous par d'autres moyens.\n\nÀ bientôt,\nNeo"}, {"id": "w3-0", "task": 3, "title": "Jeux vidéo et enfants", "prompt": "Les jeux vidéo ont-ils un effet positif ou négatif sur les enfants ? Exprimez votre opinion.", "points": ["Introduce the topic: video games and children is a heated debate", "Two views: they cause negative thoughts and aggression vs. they benefit the brain", "Your position: video games are addictive and children lack self-control", "Reasons: eyesight and health, less social contact, neglected duties; conclusion: limit playing time"], "model": "Si les jeux vidéo ont un effet positif ou négatif sur les enfants, cela fait l'objet d'un débat passionné au sein de notre société. Certaines personnes estiment qu'une exposition régulière aux jeux vidéo peut engendrer des pensées négatives et favoriser des comportements agressifs. D'autres, en revanche, considèrent que ces jeux offrent divers bénéfices pour le fonctionnement cérébral.\n\nDans ce débat, il est essentiel de rappeler que les jeux vidéo sont addictifs. Les enfants et les adolescents, dont le contrôle de soi n'est pas encore pleinement développé, peuvent aisément passer de longues heures devant les écrans, ce qui risque d'affecter leur vue ainsi que leur santé globale. De plus, un temps excessif consacré aux écrans limite leurs interactions sociales et peut nuire à l'accomplissement de leurs responsabilités, impactant ainsi leur développement personnel sur le long terme. Il est donc essentiel de restreindre autant que possible la durée qu'ils consacrent aux jeux vidéo."}, {"id": "w3-1", "task": 3, "title": "L'uniforme à l'école", "prompt": "Faut-il porter l'uniforme à l'école ? Exprimez votre opinion.", "points": ["Introduce the topic: school uniforms divide opinion", "Two views: belonging and equality vs. limits on expression and individuality", "Your position: support uniforms, school is a place to learn", "Reasons: pupils focus on study not appearance; discipline, easier for teachers to manage"], "model": "La question de l'uniforme à l'école suscite un débat passionné au sein de notre société. Certaines personnes estiment que le port de l’uniforme renforce le sentiment d’appartenance et favorise l’égalité entre les élèves, tandis que d’autres considèrent qu’il restreint la liberté d’expression et empêche les étudiants d’affirmer leur individualité. Dans ce débat, il est essentiel de rappeler que l'école est un environnement conçu pour faciliter l'apprentissage des élèves, qui doivent y consacrer toute leur énergie à absorber et à appliquer les connaissances acquises. L’instauration d’un uniforme scolaire, en imposant une tenue vestimentaire homogène, aide les élèves à se focaliser davantage sur leurs études plutôt que sur leur apparence. De plus, le port de l’uniforme peut renforcer la discipline en facilitant la gestion des élèves par les enseignants. En effet, une tenue uniforme rend le suivi des élèves plus aisé par rapport à des vêtements variés, contribuant ainsi à un environnement d’apprentissage plus calme et propice à la réussite."}, {"id": "w3-2", "task": 3, "title": "Les devoirs à la maison", "prompt": "Les devoirs à la maison sont-ils utiles ? Exprimez votre opinion.", "points": ["Introduce the topic: homework has long been debated", "Two views: builds self-discipline and parental involvement vs. unnecessary and widens inequality", "Your position: homework is a valuable chance to consolidate learning", "Reasons: independent practice aids understanding; pupils spot their own difficulties and what extra help they need"], "model": "Lles devoirs à la maison fait l'objet d'un débat passionné dans notre société depuis longtemps. Certaines personnes estiment que lles devoirs favorisent le développement de l’autodiscipline chez les élèves et encouragent l’implication des parents dans leur éducation. D’autres, en revanche, s’y opposent en affirmant qu’ils sont superflus et risquent de creuser des inégalités entre les élèves.\n\nDans ce débat, il est essentiel de rappeler que les devoirs à domicile constituent une opportunité précieuse pour les élèves de consolider les compétences acquises en classe. En effet, après une leçon, ils leur permettent de s’exercer de manière autonome, ce qui favorise une meilleure assimilation des concepts essentiels et un approfondissement de leur compréhension des sujets étudiés. De plus, en réalisant des exercices chez eux, les élèves peuvent repérer les points sur lesquels ils rencontrent des difficultés et déterminer les aspects nécessitant des aides supplémentaires."}, {"id": "w3-3", "task": 3, "title": "Interdire les voitures en ville", "prompt": "Faut-il interdire la circulation des voitures dans les centres-villes ? Exprimez votre opinion.", "points": ["Introduce the topic: banning cars in urban areas is debated", "Two views: good for the environment and quality of life vs. doomed without the right tools", "Your position: it's a major challenge, especially in dense areas", "Reasons: without adequate public transport the city could be paralysed; needs big investment in alternatives"], "model": "L’interdiction de la circulation de voitures en zones urbaines fait l'objet d'un débat passionné dans notre société. Certains pensent que ce projet, une fois réalisé, sera très bénéfique pour l’environnement et la qualité de vie des citoyens. D'autres, en revanche, expriment leur réticence en affirmant que sans la mise en œuvre des outils nécessaire, ce projet est voué à l'échec.\n\nDans ce débat, il est essentiel de reconnaître que l'interdiction de la circulation des voitures peut être un défi considérable, en particulier dans les zones urbaines densément peuplées. En effet, sans la mise en place préalable d'un système de transport public adapté aux besoins de déplacement de chacun, une interdiction de la circulation automobile risque de paralyser la ville entière, surtout aux heures de pointe. Par conséquent, la réalisation de ce projet nécessite des investissements significatifs pour développer des alternatives de transport en commun et des aménagements urbains adéquats."}, {"id": "w3-7", "task": 3, "title": "Travailler moins", "prompt": "Faut-il travailler moins pour mieux profiter de la vie ? Exprimez votre opinion.", "points": ["Introduce the topic: working less to enjoy life more is debated", "Two views: more time with loved ones vs. work is part of our identity", "Your position: a balance between work and personal life is needed", "Reasons: shorter hours may mean lower pay; overwork harms physical and mental health and relationships"], "model": "La question de savoir s’il faut travailler moins pour mieux profiter de la vie suscite un débat passionné au sein de notre société. Les partisans avancent que cela nous permet de passer plus de temps avec nos proches, alors que les opposants soutiennent l'importance du travail en faisant valoir qu'il fait partie intégrante de notre identité.\n\nDans cette discussion, je suis fermement convaincu qu'il est crucial d'établir un équilibre entre la vie professionnelle et la vie personnelle. D'un côté, il est essentiel de prendre en compte les implications financières avant de prendre une décision de réduire le temps de travail, car cela peut entraîner une réduction de salaire. D'un autre côté, il est tout aussi important de reconnaître que la recherche montre que des heures de travail excessives peuvent avoir des conséquences néfastes sur notre santé physique et mentale, ainsi que sur nos relations personnelles. Cela souligne donc la nécessité de trouver un équilibre sain entre le travail et la vie personnelle."}, {"id": "w3-9", "task": 3, "title": "Cuisiner chez soi", "prompt": "Vaut-il mieux cuisiner chez soi ou manger au restaurant ? Exprimez votre opinion.", "points": ["Introduce the topic: cooking at home or eating out is debated", "Two views: eating out saves time vs. cooking saves money and shares family moments", "Your position: cooking at home takes a lot of time", "Reasons: prepping and cleaning up are time-consuming for full-time workers; limited skill means repetitive meals"], "model": "La question de cuisiner chez soi fait l’objet d’un débat passionné dans notre société. Certains estiment que manger au restaurant leur permet de gagner du temps tout en ayant une alimentation saine, tandis que d'autres soutiennent que cuisiner chez soi leur permet de réaliser des économies financières tout en partageant des moments conviviaux en famille. Dans ce débat, il est crucial de rappeler que cuisiner chez soi peut prendre du temps, surtout si l'on doit commencer par préparer les ingrédients à partir de zéro ou si l'on cuisine pour plusieurs personnes. Il faut également prendre en compte le temps nécessaire pour nettoyer la cuisine après la préparation des repas. Les personnes qui travaillent à temps plein sont souvent confrontées à une rareté de temps, ce qui peut limiter leur capacité à préparer des repas chez eux. En outre, si l'on n'est pas un cuisinier expérimenté, on peut être limité dans les recettes que l'on peut préparer, ce qui peut conduire à des repas monotones et répétitifs."}, {"id": "w3-11", "task": 3, "title": "Transports en commun gratuits", "prompt": "Les transports en commun doivent-ils être gratuits ? Exprimez votre opinion.", "points": ["Introduce the topic: free public transport is debated", "Two views: less pollution and congestion vs. other priorities, like green spaces", "Your position: it would be a heavy expense for governments", "Reasons: running, maintenance and investment costs are high; without ticket revenue service quality may fall"], "model": "Le sujet de la gratuité des transports en commun est l'objet d'un débat passionné au sein de notre société. D'un côté, certains estiment que la gratuité des transports publics pourrait contribuer à réduire la pollution et les embouteillages, tandis que d'autres considèrent qu’il existe d'autres problèmes, tels que le réaménagement des espaces verts, à prendre en compte comme priorité.\n\nDans ce débat, il est essentiel de rappeler que la mise en place de la gratuité des transports publics peut représenter une dépense importante pour les gouvernements, qui doivent couvrir les coûts de fonctionnement, de maintenance et d'investissement des infrastructures de transport. Cela peut représenter une charge financière considérable, qui pourrait être difficile à supporter pour les budgets publics. En outre, lorsque les transports en commun sont gratuits, il peut y avoir une diminution de la qualité des services offerts, car il n'y a pas de revenus générés par la vente de billets pour financer les investissements nécessaires pour améliorer la qualité de l'infrastructure et des équipements."}, {"id": "w3-13", "task": 3, "title": "Un animal pour les enfants", "prompt": "Faut-il offrir un animal de compagnie aux enfants ? Exprimez votre opinion.", "points": ["Introduce the topic: giving children a pet is debated", "Two views: teaches responsibility and autonomy vs. high costs and a big commitment", "Your position: pets bring many benefits that shouldn't be ignored", "Reason 1: company and emotional support when children feel lonely; reason 2: teaches empathy and caring for others' needs"], "model": "Le sujet de savoir s'il convient de donner un animal de compagnie aux enfants suscite un débat passionné au sein de notre société. Les partisans de cette idée soutiennent que la garde d'un animal domestique pourrait apprendre aux enfants la responsabilité et l'autonomie, tandis que les opposants expriment leur réticence en affirmant que cela implique des coûts élevés et une grande responsabilité.\n\nDans ce débat, il est essentiel de reconnaître que la garde d’un animal domestique présente de nombreux avantages qui ne doivent pas être ignorés. Premièrement, les enfants peuvent se sentir seuls ou isolés à certains moments de leur vie, notamment lorsqu'ils font face à un déménagement, un changement familial ou une distance physique avec leurs parents. Dans ces moments de solitude, les animaux domestiques peuvent offrir une présence inconditionnelle et un soutien émotionnel essentiel pour leur bien-être mental. Deuxièmement, les animaux domestiques peuvent aider à enseigner aux enfants des compétences sociales importantes telles que l'empathie. En prenant soin d'un animal, les enfants apprennent à reconnaître et à répondre aux besoins des autres."}, {"id": "w3-16", "task": 3, "title": "Menu végétarien à la cantine", "prompt": "Faut-il mettre en place un menu végétarien dans les cantines scolaires ? Exprimez votre opinion.", "points": ["Introduce the topic: a vegetarian menu in school canteens is debated", "Two views: good for pupils' health vs. disadvantages poorer families and local producers", "Your position: a balanced diet is essential for pupils' health", "Reasons: young people eat too much meat and need vitamins and fibre; meat has a high carbon footprint, so a vegetarian menu reduces environmental impact"], "model": "La mise en place d'un menu végétarien dans les cantines scolaires est l'objet d'un débat passionné au sein de notre société. Les partisans de cette pratique soutiennent qu'elle serait bénéfique pour la santé des élèves, tandis que les opposants estiment qu'elle pourrait défavoriser les familles en difficulté ainsi que les producteurs locaux.\n\nDans ce débat, il convient de reconnaître que la mise en place d'un régime alimentaire équilibré est fondamentale pour la santé des élèves. À l'heure actuelle, il est constaté que les jeunes consomment une quantité excessive de viande dans leur alimentation, ce qui n'est ni bénéfique pour leur santé, ni pour l'environnement. Il est donc crucial d'intégrer des éléments végétariens dans leur alimentation, afin de leur fournir les nutriments essentiels tels que les vitamines et les fibres. Par ailleurs, la production de viande est souvent associée à une empreinte carbone élevée et à des émissions de gaz à effet de serre. La mise en place d'un menu végétarien peut ainsi contribuer à réduire l'impact environnemental de la cantine scolaire."}, {"id": "w3-18", "task": 3, "title": "Nouvelles technologies et enfants", "prompt": "Les enfants doivent-ils utiliser les nouvelles technologies ? Exprimez votre opinion.", "points": ["Introduce the topic: children's use of new technology is debated", "Two views: supports school development vs. prevents an active, physical life", "Your position: excessive use has negative consequences", "Reasons: eye strain, headaches, insomnia, obesity, addiction; exposure to inappropriate content, so use should be limited and supervised"], "model": "Le sujet de l'utilisation des nouvelles technologies par les enfants est au cœur d'un débat passionné dans notre société. Les partisans de cette pratique soutiennent qu'elle favorise le développement scolaire des enfants, alors que les opposants expriment leur réticence en affirmant que cela peut les empêcher de mener une vie active physiquement.\n\nDans ce débat, il est essentiel de rappeler que l'utilisation excessive des nouvelles technologies, telles que les ordinateurs, les smartphones et les tablettes, peut avoir des conséquences négatives sur la santé des enfants. En effet, elle peut causer des problèmes tels que la fatigue visuelle, les maux de tête, les douleurs musculaires, l'insomnie et l'obésité. Elle peut également entraîner une dépendance, ce qui peut affecter négativement le développement social, émotionnel et cognitif de l'enfant. En outre, les nouvelles technologies peuvent exposer les enfants à des contenus inappropriés, comme la violence, la pornographie et le cyberharcèlement. C’est pour tous ces impacts négatifs qu’il faut limiter et surveiller l’utilisation des nouvelles technologies par les enfants."}], "oral": [{"id": 1, "zh": "Introducing yourself", "fr": "Se présenter", "prio": "Every day", "examples": [{"q": ["Pouvez-vous vous présenter ?", "Quel est votre nom, votre âge, votre nationalité ?"], "a": "Je m'appelle Neo, enfin Zhenzhao Li est mon nom officiel. Je suis chinois, et j'ai actuellement plus de vingt ans. Je vis à Halifax, au Canada, où je suis étudiant en informatique à l'Université Dalhousie."}, {"q": ["Depuis combien de temps êtes-vous au Canada ?"], "a": "Je suis arrivé au Canada il y a quelques années pour mes études. Avant cela, j'ai vécu en Chine, où j'ai fait des études d'économie, puis un master en traduction anglaise."}], "opener": "Je m'appelle Neo, enfin Zhenzhao Li est mon nom officiel.", "follow": []}, {"id": 2, "zh": "Family", "fr": "La famille", "prio": "2–3 times a week", "examples": [{"q": ["Parlez-moi un peu de votre famille."], "a": "Ma famille vit actuellement aux États-Unis. Je suis moi-même au Canada pour mes études, donc nous vivons dans deux pays différents, mais nous nous parlons souvent grâce à internet."}, {"q": ["Avez-vous des frères et sœurs ?"], "a": "Oui, j’ai une sœur aînée. Elle vit aux États-Unis. Elle a maintenant deux petits neveux adorables. Nous discutons souvent en vidéo, de nos vies et des études des enfants."}], "opener": "Ma famille vit actuellement aux États-Unis.", "follow": [{"zh": "And you, where are you?", "a": "Moi, je suis au Canada pour mes études, donc on vit dans deux pays différents."}, {"zh": "How do you stay in touch?", "a": "On se parle très régulièrement grâce à internet, presque tous les jours."}, {"zh": "Has your family visited you / have you been back to see them?", "a": "Pas encore, mais j'espère que ça sera possible bientôt, une fois que mon emploi du temps sera plus stable."}, {"zh": "Does your family support your studies in Canada?", "a": "Oui, tout à fait, ils m'encouragent beaucoup dans mes études et mon apprentissage du français."}, {"zh": "Do you have brothers or sisters?", "a": "Oui, j’ai une sœur aînée. Elle vit aux États-Unis. Elle a maintenant deux petits neveux adorables. Nous discutons souvent en vidéo, de nos vies et des études des enfants."}]}, {"id": 3, "zh": "Studies", "fr": "Les études", "prio": "Every day", "examples": [{"q": ["Que faites-vous comme études actuellement ?"], "a": "J'étudie l'informatique à l'Université Dalhousie. Je suis actuellement en troisième année, et je devrais terminer mes études en 2028."}, {"q": ["Pourquoi avez-vous choisi ce domaine ?"], "a": "En fait, ce n'est pas mon premier domaine d'études. J'ai d'abord étudié l'économie, puis j'ai fait un master en traduction anglaise. J'ai choisi l'informatique plus tard, parce que je voulais avoir la capacité de créer mes propres applications et produits."}], "opener": "J'étudie l'informatique à l'Université Dalhousie.", "follow": []}, {"id": 4, "zh": "Work and career", "fr": "Le travail", "prio": "Weekly", "examples": [{"q": ["Travaillez-vous actuellement ?"], "a": "Bientôt, je vais travailler à temps partiel dans une entreprise canadienne grâce au programme Volta. Ce sera ma première expérience professionnelle ici au Canada."}, {"q": ["Quels sont vos projets professionnels ?"], "a": "Je voudrais travailler dans le domaine de l'analyse de données ou des systèmes informatiques après mes études, et rester au Canada pour y construire ma carrière."}], "opener": "Je vais bientôt commencer un travail à temps partiel chez Volta.", "follow": [{"zh": "What is Volta?", "a": "C'est un programme qui met en relation des étudiants avec de vraies entreprises canadiennes."}, {"zh": "What exactly will you do?", "a": "Je vais probablement travailler sur des projets liés à l'analyse de données."}, {"zh": "When did it start?", "a": "Ça a commencé début septembre, donc c'est très récent."}, {"zh": "Is this your first job in Canada?", "a": "Oui, exactement, ce sera ma première expérience professionnelle ici."}, {"zh": "Are you nervous / how do you feel?", "a": "Un peu, comment dire, mais surtout j'ai vraiment hâte de commencer."}, {"zh": "What field do you want to work in later?", "a": "Je voudrais travailler dans l'analyse de données ou les systèmes informatiques après mes études."}]}, {"id": 5, "zh": "Daily life", "fr": "La vie quotidienne", "prio": "2–3 times a week", "examples": [{"q": ["Décrivez une journée typique pour vous."], "a": "En général, je vais à mes cours le matin, puis je passe du temps à étudier ou à pratiquer mon français l'après-midi. Le soir, j'aime me détendre en écoutant de la musique."}, {"q": ["Votre routine a-t-elle changé récemment ?"], "a": "Oui, à partir de septembre, mon emploi du temps va beaucoup changer, parce que je dois combiner mes cours, mon travail chez Volta et l'apprentissage du français."}], "opener": "Mon emploi du temps a beaucoup changé depuis septembre.", "follow": [{"zh": "Why did it change?", "a": "Parce que je dois maintenant combiner mes cours, mon travail chez Volta et l'apprentissage du français."}, {"zh": "Then describe a typical day?", "a": "En général, je vais à mes cours le matin, puis je travaille l'après-midi."}, {"zh": "When do you practise French?", "a": "Souvent pendant les trajets en bus, entre deux activités."}, {"zh": "Is it busy / can you cope?", "a": "Oui, c'est assez chargé, mais et bien, j'essaie de bien m'organiser."}, {"zh": "And at the weekend?", "a": "Le week-end, c'est plutôt plus calme, je peux me détendre un peu plus."}]}, {"id": 6, "zh": "Hobbies and free time", "fr": "Les loisirs", "prio": "Weekly, with detail", "examples": [{"q": ["Qu'aimez-vous faire pendant votre temps libre ?"], "a": "J'aime beaucoup la photographie et la musique. Récemment, j'ai aussi commencé à préparer mon propre café à la maison, comme un latte au matcha ou à la noix de coco."}, {"q": ["Avez-vous un sport que vous pratiquez ?"], "a": "Oui, j'ai appris à nager cette année, grâce à mon ami. Maintenant, je sais faire le crawl, la brasse et le dos crawlé, et j'en suis très fier."}], "opener": "J'aime beaucoup la photographie et la musique.", "follow": []}, {"id": 7, "zh": "Where you live", "fr": "Le lieu de vie", "prio": "Once a week", "examples": [{"q": ["Où habitez-vous ? Décrivez votre ville ou votre quartier."], "a": "J'habite à Halifax, en Nouvelle-Écosse. C'est une ville universitaire au bord de l'océan Atlantique. La ville n'est pas très grande, elle est calme mais dynamique, grâce à tous les étudiants. Il y a beaucoup de parcs et de plages, j'aime beaucoup marcher au bord de la mer quand le temps est beau. Je me déplace principalement en bus, car le réseau de transport en commun est bien développé. Comme je suis étudiant, je n'ai pas vraiment besoin de voiture au quotidien."}, {"q": ["Aimez-vous l'endroit où vous vivez ?"], "a": "Oui, j'aime bien Halifax, parce que c'est une ville calme mais quand même assez dynamique grâce aux étudiants."}], "opener": "J'habite à Halifax, en Nouvelle-Écosse.", "follow": [{"zh": "Describe the city?", "a": "C'est une ville universitaire, assez calme, au bord de l'océan Atlantique."}, {"zh": "What kind of home do you live in?", "a": "Je vis dans un appartement, pas très loin de mon université."}, {"zh": "How do you get around?", "a": "Je me déplace principalement en bus, je n'ai pas besoin de voiture."}, {"zh": "Do you like it here?", "a": "Oui, j'aime bien, c'est dynamique grâce aux étudiants, mais pas trop bruyant non plus."}, {"zh": "Do you want to live here for good?", "a": "Pour l'instant oui, mais ça dépendra surtout de mes opportunités professionnelles."}]}, {"id": 8, "zh": "Future plans", "fr": "Les projets d'avenir", "prio": "Weekly", "examples": [{"q": ["Quels sont vos projets pour les prochaines années ?"], "a": "Je voudrais obtenir un niveau B2 en français d'ici la fin de l'année, et continuer à acquérir mon expérience professionnelle au Canada grâce à des programmes comme Volta."}, {"q": ["Voyez-vous votre avenir au Canada ?"], "a": "Oui, je pense rester au Canada pour ma carrière, parce que c'est un environnement qui correspond bien à mes objectifs professionnels et personnels."}], "opener": "J'ai deux objectifs principaux pour les prochaines années.", "follow": [{"zh": "Which two?", "a": "D'abord, obtenir un niveau B2 en français d'ici la fin de l'année."}, {"zh": "And then?", "a": "Ensuite, continuer à construire mon expérience professionnelle au Canada."}, {"zh": "Why is French so important?", "a": "Parce que c'est essentiel pour bien m'intégrer et pour mes projets d'immigration."}, {"zh": "Do you plan to stay in Canada?", "a": "Oui, je pense rester ici pour ma carrière, ça correspond bien à mes objectifs."}, {"zh": "Where do you see yourself in five years?", "a": "Comment dire... probablement toujours au Canada, avec un poste dans l'analyse de données."}]}, {"id": 9, "zh": "Personal belongings", "fr": "Les objets personnels", "prio": "Once a week", "examples": [], "opener": "J'ai un objet auquel je tiens beaucoup.", "follow": [{"zh": "What is it?", "a": "C'est mon appareil photo, je l'utilise très souvent."}, {"zh": "Why is it so important?", "a": "Parce que la photographie est une de mes passions, et il me suit partout."}, {"zh": "When did you start photography?", "a": "Depuis quelques années déjà, mais je m'y suis vraiment mis plus sérieusement récemment."}, {"zh": "Any other important items?", "a": "Oui, et bien, j'ai aussi tout mon matériel pour préparer du café à la maison."}]}], "conj": {"être": {"zh       if(ok && s.toLowerCase() === c){ hit = {from:i, to:last, ans:toks.slice(i, last + 1).join('')}; break; }
    }
    if(hit){ cands.push(hit); for(let j = hit.from; j <= hit.to; j++) taken.add(j); wi += hit.ans.split(/\s+/).length - 1; continue; }
    const w = toks[i].toLowerCase().replace(/^.*['’]/, '');
    if(AUXW.has(w) && words[wi + 1] != null){
      const nx = words[wi + 1], nt = toks[nx];
      if(PPRE.test(nt) && nt.length >= 3 && toks.slice(i + 1, nx).join('').trim() === ''){ cands.push({from:nx, to:nx, ans:nt}); taken.add(nx); }
    }
  }
  const target = 9;
  if(cands.length < target){
    for(let wi = 1; wi < words.length && cands.length < target; wi++){
      const i = words[wi]; if(taken.has(i)) continue;
      const prev = toks[words[wi - 1]].toLowerCase().replace(/^.*['’]/, '');
      if(/(er|ir|re)$/.test(toks[i]) && toks[i].length >= 5 && ['de','d','à','pour','afin','pouvoir','vouloir','aller','peut','pouvez','pourrez','pourrais'].includes(prev)){ cands.push({from:i, to:i, ans:toks[i]}); taken.add(i); }
    }
  }
  if(cands.length < target){
    const longs = words.filter(i => !taken.has(i) && toks[i].length >= 8);
    const need = target - cands.length, step = Math.max(1, Math.floor(longs.length / need));
    for(let k = 0; k < longs.length && cands.length < target; k += step){ cands.push({from:longs[k], to:longs[k], ans:toks[longs[k]]}); taken.add(longs[k]); }
  }
  cands.sort((a, b) => a.from - b.from);
  const MAX = 14; let chosen = cands;
  if(cands.length > MAX){ const step = cands.length / MAX; chosen = Array.from({length:MAX}, (_, k) => cands[Math.floor(k * step)]); }
  const mask = new Map(); chosen.forEach(c => mask.set(c.from, c));
  const out = []; let i = 0;
  while(i < toks.length){ const c = mask.get(i); if(c){ out.push({b:c.ans}); i = c.to + 1; } else { out.push({t:toks[i]}); i++; } }
  return out;
}

}
