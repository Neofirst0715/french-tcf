  if(!V.cur && V.mode === 'table') V.cur = pickDrill();
  m.innerHTML = `
  ${lt('Tenses', 'Conjugation drills and tense spotting')}
  <div class="seg" data-ai><button data-act="tmode" data-k="table" aria-pressed="${V.mode === 'table'}">Conjugation tables</button><button data-act="tmode" data-k="id" aria-pressed="${V.mode === 'id'}">Spot the tense</button></div>
  <section class="card"><p class="muted small">${V.mode === 'table' ? 'Write the whole table from memory, then check. Combinations you miss come back more often. You can leave out the pronouns.' : 'Paste a French text (or use a model text). The AI pulls out the verbs and you decide which tense each one is.'}</p></section>
  <div id="tbody" class="stack"></div>
  <section class="card"><details ${V.mode === 'table' ? 'open' : ''}><summary>Choose verbs and tenses</summary>
    <div class="stack" style="margin-top:12px">
      <div class="row"><b class="small" style="font-weight:600">Verbs</b><button class="btn sm" data-act="vall">All</button><button class="btn sm" data-act="vnone">None</button></div>
      <div class="vgrid">${verbs.map(v => `<button class="chip" data-act="vtog" data-v="${esc(v)}" aria-pressed="${V.vs.has(v)}">${esc(v)}</button>`).join('')}</div>
      <b class="small" style="font-weight:600">Tenses</b>
      <div class="vgrid">${TENSES.map(t => `<button class="chip" data-act="ttog" data-t="${esc(t)}" aria-pressed="${V.ts.has(t)}">${esc(t)} <span class="muted">${TZH[t]}</span></button>`).join('')}</div>
    </div></details></section>`;
  if(V.mode === 'table') tTable($('#tbody')); else tID($('#tbody'));
}
function tTable(b){
  if(!V.cur){ b.innerHTML = '<section class="card"><p>Pick at least one verb and one tense.</p></section>'; return; }
  const [v, t] = V.cur, c = DATA.conj[v];
  b.innerHTML = `<section class="card">
    <div class="row between"><h3><span style="font-size:1.6rem;font-weight:300">${esc(v)}</span> <span class="muted small">${esc(c.zh)}</span></h3><span class="tag acc">${esc(t)} · ${TZH[t]}</span></div>
    <div class="stack" id="drows">${c.forms[t].map((f, i) => `<div class="drow" data-i="${i}"><label for="d${i}">${esc(pronLabel(i, f, t))}</label><input class="in" id="d${i}" autocomplete="off" autocapitalize="off" spellcheck="false"><span class="mk"></span></div>`).join('')}</div>
    <div class="row"><button class="btn primary" data-act="dcheck">Check</button><button class="btn" data-act="dnext">Another table</button>
      <label class="small row" style="gap:6px"><input type="checkbox" id="dloose"> Ignore accents</label><span id="dres" class="small muted"></span></div>
    ${c.aux === 'être' && (t === 'passé composé' || t === 'plus-que-parfait') ? '<p class="small muted">This verb takes être, so the past participle agrees with the subject. allé, allée and allé(e) are all accepted.</p>' : ''}
  </section>`;
  $('#d0').focus();
}
async function tID(b){
  b.innerHTML = `<section class="card"><h3>Text</h3>
    <textarea id="idtext" style="min-height:130px" placeholder="Paste French text here (60 to 120 words works best)">${esc(V.idtext || '')}</textarea>
    <div class="row"><button class="btn" data-act="idsample">Use a model text</button><button class="btn primary" data-act="idrun">Extract verbs</button></div></section>
    <div id="idout">${V.idres ? idHTML() : ''}</div>`;
}
function idHTML(){
  const r = V.idres;
  return `<section class="card"><h3>Name the tense <span class="muted small">(${r.length} verbs, tagged by AI; check a grammar book if in doubt)</span></h3>
    <div class="scroll"><table><thead><tr><th>In the text</th><th>Your answer</th><th></th></tr></thead><tbody>${r.map((x, i) => `<tr data-i="${i}"><td style="font-size:1rem">${esc(x.form)}</td><td><select class="in" aria-label="Tense ${i + 1}"><option value="">Choose a tense</option>${IDENT.map(t => `<option>${esc(t)}</option>`).join('')}</select></td><td class="small"></td></tr>`).join('')}</tbody></table></div>
    <div class="row"><button class="btn primary" data-act="idcheck">Check</button><span id="idres" class="small muted"></span></div></section>`;
}
const IDPROMPT = txt => `You are a French teacher. In the text below, find the conjugated verb forms (at most 22, in order of appearance; choose varied forms and skip obvious repeats). For each give: "form" (the form as it appears, with auxiliary and pronoun if present, for example "j'ai rejoint"), "inf" (the infinitive), "tense" (exactly one of these values: ${IDENT.join(', ')}), "person" (je, tu, il, elle, on, nous, vous, ils, elles, ce, cela...).
Reply ONLY with a JSON array.
Text:
"""
${txt}
"""`;

/* ---------- Progress ---------- */
function rProg(m){
  const days = []; for(let i = 13; i >= 0; i--){ const d = new Date(); d.setDate(d.getDate() - i); const x = S.days[ymd(d)] || {w:0,o:0,d:0}; days.push({d, n:x.w + x.o + x.d, x}); }
  const mx = Math.max(3, ...days.map(x => x.n));
  const totals = Object.values(S.days).reduce((a, x) => ({w:a.w + (x.w || 0), o:a.o + (x.o || 0), d:a.d + (x.d || 0)}), {w:0,o:0,d:0});
  const doneLv = ITEMS.reduce((a, it) => a + wProgress(it.id), 0);
  const st = S.drill.stats;
  m.innerHTML = `
  ${lt('Progress', 'Your last two weeks at a glance')}
  <section class="grid">
    <div class="card stat"><span class="muted small">Writing</span><b>${totals.w}</b><span class="small muted">${doneLv} of ${ITEMS.length * 5} levels done</span></div>
    <div class="card stat"><span class="muted small">Speaking</span><b>${totals.o}</b><span class="small muted">${Object.keys(S.oral.cards).length} different cards seen</span></div>
    <div class="card stat"><span class="muted small">Tenses</span><b>${totals.d}</b></div>
  </section>
  <section class="card"><h3>Last 14 days</h3>
    <div style="display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:90px">${days.map(x => `<div title="${ymd(x.d)}: ${x.n}" style="height:${Math.max(4, x.n / mx * 100)}%;background:${x.n ? 'var(--orange)' : 'var(--edge)'};border-radius:99px"></div>`).join('')}</div>
    <div class="row between small muted"><span>${ymd(days[0].d).slice(5)}</span><span>Today</span></div></section>
  <section class="card"><h3>Tense accuracy</h3>
    ${Object.keys(st).length ? `<table><tbody>${TENSES.filter(t => st[t]).map(t => { const p = Math.round(st[t].c / st[t].t * 100); return `<tr><td>${esc(t)}</td><td style="width:45%"><div class="bar"><i style="width:${p}%;background:${p >= 80 ? 'var(--ok)' : 'var(--orange)'}"></i></div></td><td class="num">${p}%</td></tr>`; }).join('')}</tbody></table>` : '<p class="muted small">Nothing yet. Do a few conjugation tables and your accuracy will show here.</p>'}</section>
  <section class="card"><div class="row between"><h3>Mistakes notebook <span class="muted small">(${S.errors.length})</span></h3>${S.errors.length ? '<button class="btn sm" data-act="errclear">Clear</button>' : ''}</div>
    ${S.errors.length ? `<div class="stack">${(function(){ const by = {}; S.errors.forEach(e => by[e.type] = (by[e.type] || 0) + 1); return '<div class="row">' + Object.entries(by).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<span class="tag warn">${esc(k)} ${n}</span>`).join('') + '</div>'; })()}
      <div class="scroll"><table><thead><tr><th>You wrote</th><th>Better</th><th>Why</th></tr></thead><tbody>${S.errors.slice(0, 40).map(e => `<tr><td style="color:var(--bad)">${esc(e.orig)}</td><td style="color:var(--ok);font-weight:600">${esc(e.fix)}</td><td class="small">${esc(e.type)}: ${esc(e.why)}</td></tr>`).join('')}</tbody></table></div></div>` : '<p class="muted small">After the AI reviews a text, the mistakes are saved here so you can see which kinds keep coming back.</p>'}</section>
  <section class="card flat small muted">${AI ? 'Progress is saved to your account, so it follows you to other devices.' : 'Progress is saved in this browser on this device only.'} <button class="btn sm" data-act="reset" style="margin-left:8px">Erase all progress</button></section>`;
}

/* ---------- events ---------- */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, body = $('#lvbody');
  switch(a){
    case 'tab': return go(el.dataset.k);
    case 'goto': return go(el.dataset.k);
    case 'wfilter': V.f = +el.dataset.k; return render();
    case 'openw': return go('write', {id:el.dataset.id, lv:+el.dataset.lv || recLevel(el.dataset.id)});
    case 'wback': return go('write');
    case 'wlv': V.lv = +el.dataset.lv; return render();
    case 'c1check': { let ok = 0, tot = 0; const loose = $('#loose').checked; $$('input.blank', body).forEach(i => { tot++; const good = norm(i.value, loose) === norm(i.dataset.ans, loose); i.classList.toggle('ok', good); i.classList.toggle('bad', !good && i.value.trim() !== ''); if(good) ok++; });
      $('#c1res').textContent = ok + ' / ' + tot + ' correct'; if(ok / tot >= .8){ const it = body._it, w = body._w; if(!w.done[1]) markDone(it, w, 1, {score:ok + '/' + tot}); } return; }
    case 'c1show': $$('input.blank', body).forEach(i => { i.value = i.dataset.ans; i.classList.add('ok'); i.classList.remove('bad'); }); return;
    case 's2cmp': $$('.cmp', body).forEach(c => c.hidden = false); return;
    case 's2done': { const it = body._it, w = body._w; if(!w.done[2]) markDone(it, w, 2); else toast('Already completed'); return; }
    case 'aifb': return runFeedback(body, +el.dataset.lv);
    case 'm3start': { $('#m3model').hidden = false; el.disabled = true; startTimer($('#tm'), 90, {onEnd: () => { $('#m3model').hidden = true; el.disabled = false; el.textContent = 'Look again'; $('#t3a').focus(); }}); return; }
    case 'm3peek': { const it = body._it, c = $('#m3cmp'); c.hidden = false; c.innerHTML = modelHTML(it); return; }
    case 'done3': { const it = body._it, w = body._w; if(!w.done[3]) markDone(it, w, 3, {words:wordCount($('#t3b').value)}); else toast('Already completed'); return; }
    case 'done5': { const it = body._it, w = body._w; stopTimer(); if(!w.done[5]) markDone(it, w, 5, {words:wordCount($('#t5').value)}); else toast('Already completed'); return; }
    case 'peek5': $('#m5').hidden = !$('#m5').hidden; return;
    case 'peek4': $('#m4').hidden = !$('#m4').hidden; return;
    case 'done4': { const it = body._it, w = body._w; if(!w.done[4]) markDone(it, w, 4, {words:wordCount($('#t4').value)}); else toast('Already completed'); return; }
    case 't5start': { const it = body._it, t = TASK[it.task], ta = $('#t5'); ta.disabled = false; ta.focus(); el.disabled = true;
      startTimer($('#tm'), t.secs, {onEnd: () => { toast("Time's up"); $('#used').textContent = 'Over time'; }}); return; }
    case 'otog': { const id = +el.dataset.id; V.sel.has(id) ? V.sel.delete(id) : V.sel.add(id); el.setAttribute('aria-pressed', V.sel.has(id)); return; }
    case 'oall': V.sel = new Set(DATA.oral.map(c => c.id)); return render();
    case 'onone': V.sel = new Set(); return render();
    case 'ostart': { if(!V.sel || !V.sel.size) V.sel = new Set(DATA.oral.map(c => c.id)); V.run = {mode:el.dataset.mode, n:0}; return render(); }
    case 'oend': { const r = V.run; if(r && r.mode === 'mock'){ V.last_n = r.n; return finishMock(); } V.run = null; stopTimer(); return render(); }
    case 'oshow': { V.run.shown = true; $('#oans').hidden = false; el.disabled = true; return; }
    case 'onext': { const R = V.run; if(R.card){ S.oral.cards[R.card.key] = Object.assign(S.oral.cards[R.card.key] || {}, {last:1, ts:Date.now()}); } R.n++; R.last = R.card && R.card.key; R.card = null; save(); return render(); }
    case 'orate': { const R = V.run; S.oral.cards[R.card.key] = {last:+el.dataset.r, ts:Date.now()}; R.n++; R.last = R.card.key; R.card = null; bump('o'); return render(); }
    case 'oread': return speak(el.dataset.w === 'q' ? V.run.card.cue : V.run.card.ans);
    case 'osay': { const R = V.run, c = R.card, said = $('#said').value.trim(), box = $('#ofb'); if(wordCount(said) < 3){ box.innerHTML = '<p class="muted small">Write what you said first.</p>'; return; }
      box.innerHTML = '<p class="muted small">The AI is listening to your answer…</p>';
      try{ const r = await askJSON(`You are a TCF Canada examiner, spoken expression, Task 1 (guided interview, about 2 minutes, target level CLB 7). The student answered out loud; what follows is an approximate transcript (it may contain dictation errors; do not count obvious ones as the student's mistakes). All explanations must be in English; French is only for corrections and model sentences.
Question or topic: ${c.cue}
Student's own model answer: ${c.ans}
What the student said: """${said}"""
Reply ONLY with JSON: {"answers":true or false (answers the question),"summary":"assessment in English, 1 or 2 sentences","errors":[{"orig":"","fix":"","why":"short explanation in English"}],"natural":"a more natural, fluent version in French, 2 to 4 sentences","tip":"one concrete tip for next time, in English"}`, 'flash');
        box.innerHTML = `<div class="stack"><p>${esc(r.summary)}</p>${(r.errors || []).map(e => `<div class="err"><span class="o">${esc(e.orig)}</span><span class="f">→ ${esc(e.fix)}</span><span class="small muted">${esc(e.why)}</span></div>`).join('')}<div class="answer">${esc(r.natural)}</div><p class="small"><b style="font-weight:600">Next time:</b> ${esc(r.tip)}</p></div>`;
      }catch(e){ box.innerHTML = `<p style="color:var(--bad)">${aiErr(e)}</p>`; } return; }
    case 'tmode': V.mode = el.dataset.k; V.cur = null; return render();
    case 'vtog': { const v = el.dataset.v; V.vs.has(v) ? V.vs.delete(v) : V.vs.add(v); el.setAttribute('aria-pressed', V.vs.has(v)); V.cur = null; return; }
    case 'ttog': { const t = el.dataset.t; V.ts.has(t) ? V.ts.delete(t) : V.ts.add(t); el.setAttribute('aria-pressed', V.ts.has(t)); V.cur = null; return; }
    case 'vall': V.vs = new Set(Object.keys(DATA.conj)); V.cur = null; return render();
    case 'vnone': V.vs = new Set(); V.cur = null; return render();
    case 'drill': go('tense', {mode:'table', vs:new Set([el.dataset.v]), ts:new Set([el.dataset.t]), cur:[el.dataset.v, el.dataset.t]}); return;
    case 'dnext': V.cur = pickDrill(); return tTable($('#tbody'));
    case 'dcheck': { const [v, t] = V.cur, loose = $('#dloose').checked; let ok = 0;
      $$('.drow').forEach(r => { const i = +r.dataset.i, inp = $('input', r), mk = $('.mk', r), old = $('.corr', r); if(old) old.remove();
        const val = norm(stripPron(inp.value), loose), acc = accepted(v, t, i).map(x => norm(x, loose));
        const good = acc.includes(val); inp.classList.toggle('ok', good); inp.classList.toggle('bad', !good); mk.textContent = good ? '✓' : '✗'; mk.style.color = good ? 'var(--ok)' : 'var(--bad)';
        if(!good){ const d = document.createElement('div'); d.className = 'corr'; d.textContent = DATA.conj[v].forms[t][i]; r.appendChild(d); } else ok++; });
      $('#dres').textContent = ok + ' / 6 correct';
      const k = v + '|' + t; S.drill.wrong[k] = ok === 6 ? Math.max(0, (S.drill.wrong[k] || 0) - 1) : (S.drill.wrong[k] || 0) + 1;
      const s = S.drill.stats[t] = S.drill.stats[t] || {c:0, t:0}; s.c += ok; s.t += 6; bump('d'); return; }
    case 'idsample': { const it = pick(ITEMS.filter(x => x.task < 3)); $('#idtext').value = it.model.replace(/\n\n/g, '\n'); return; }
    case 'idrun': { const txt = $('#idtext').value.trim(); if(wordCount(txt) < 15){ toast('Paste a text first'); return; } V.idtext = txt; const out = $('#idout'); out.innerHTML = '<section class="card"><p class="muted">The AI is finding the verbs…</p></section>';
      try{ const r = await askJSON(IDPROMPT(txt), 'flash'); V.idres = (Array.isArray(r) ? r : (r.verbs || [])).filter(x => x && x.form && x.tense).slice(0, 22); out.innerHTML = idHTML(); }
      catch(e){ out.innerHTML = `<section class="card"><p style="color:var(--bad)">${aiErr(e)}</p></section>`; } return; }
    case 'idcheck': { let ok = 0, tot = 0; $$('#idout tbody tr').forEach(tr => { const i = +tr.dataset.i, x = V.idres[i], sel = $('select', tr), cell = tr.lastElementChild; tot++;
        const good = sel.value === x.tense; if(good) ok++; sel.classList.toggle('bad', !good && !!sel.value);
        cell.innerHTML = good ? '<span style="color:var(--ok)">✓</span>' : `<span style="color:var(--bad)">${esc(x.tense)}</span><br><span class="muted">${esc(x.inf || '')} · ${esc(x.person || '')}</span>`; });
      $('#idres').textContent = ok + ' / ' + tot + ' correct'; bump('d'); return; }
    case 'errclear': S.errors = []; save(); return render();
    case 'reset': { if(!el._arm){ el._arm = true; el.textContent = 'Tap again to confirm'; setTimeout(() => { el._arm = false; el.textContent = 'Erase all progress'; }, 3000); return; } S = blank(); save(); toast('Progress erased'); return render(); }
  }
});
function recLevel(id){ const w = S.writing[id]; let lv = 1; while(w && w.done && w.done[lv] && lv < 5) lv++; return lv; }

/* ---------- init ---------- */
countdown();
render();
initStore();
})();
</script>

</body>
</html>
